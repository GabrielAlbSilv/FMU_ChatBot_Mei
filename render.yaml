services:
  - type: web
    name: chatbot-mei
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python preparar_base.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      # Senha do GitHub Actions para pedir uma coleta dos sites (mesmo valor no secret BASE_WEB_TOKEN)
      - key: BASE_WEB_TOKEN
        sync: false
      # Senha para ver os detalhes técnicos de /api/status (cabeçalho X-Token). Gerada pelo Render.
      - key: STATUS_TOKEN
        generateValue: true
      # Banco PostgreSQL opcional (Neon gratuito) para guardar métricas, votos e avaliações. docs/BANCO.md
      - key: DATABASE_URL
        sync: false
      # IP real de quem acessa (preenchido pelo Cloudflare na frente do Render; não dá para falsificar)
      - key: CABECALHO_IP
        value: True-Client-IP
